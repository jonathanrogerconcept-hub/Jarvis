<html lang="fr">
<head>
<meta charset="utf-8">

<title>JRC Jarvis</title>
<meta name="description" content="Assistant IA pour entreprises, indépendants et équipes internes.">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#F7F5F0;--card:#fff;--ink:#0E1116;--mut:#6B7280;--acc:#1F3A5F;--on:#fff;--brass:#B08D57;--bd:#E6E2D9;--ok:#2F7D5B;--warn:#B7791F;--err:#B23A3A;--sh:0 1px 2px rgba(14,17,22,.04),0 8px 24px rgba(14,17,22,.04);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1116;--card:#171B22;--ink:#F2F0EA;--mut:#9AA1AD;--acc:#3A5F93;--bd:#262C36;--ok:#4DB38A;--warn:#D9A441;--err:#E0716F;--sh:none}}
:root[data-theme="dark"]{--bg:#0E1116;--card:#171B22;--ink:#F2F0EA;--mut:#9AA1AD;--acc:#3A5F93;--bd:#262C36;--ok:#4DB38A;--warn:#D9A441;--err:#E0716F;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;flex-direction:column;height:100%}
#side,#top{display:none}
main{flex:1;overflow-y:auto;padding:20px 20px 96px;max-width:1280px;width:100%;margin:0 auto}
.serif{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.2}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:20px}
.btn{height:48px;padding:0 20px;border-radius:12px;background:var(--acc);color:var(--on);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.98)}.btn:hover{opacity:.92}
.btn.s{background:none;border:1px solid var(--bd);color:var(--ink)}
.btn.t{background:none;color:var(--acc);padding:0;height:auto;font-weight:600}
:root[data-theme="dark"] .btn.t{color:#8FB0DE}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{height:36px;padding:0 14px;border:1px solid var(--bd);border-radius:999px;background:var(--card);font-size:14px;transition:.2s}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.composer{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 8px 8px 16px;box-shadow:var(--sh)}
.composer input{flex:1;border:0;background:none;outline:0;min-height:44px;min-width:0}
.composer:focus-within{border-color:var(--acc)}
.send{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--mut);border-radius:12px}
.grid{display:grid;gap:16px;margin-top:20px}
.card h3{font-size:16px;font-weight:600}
.card p{font-size:14px;color:var(--mut);margin:4px 0 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd);font-size:14px}
.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0}.row b{font-weight:500;display:block}.row small{color:var(--mut);font-size:12px}
.sec{font-size:14px;font-weight:600;margin:28px 0 8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--mut))}
.ok{--c:var(--ok)}.wa{--c:var(--warn)}
.av{width:36px;height:36px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.av.j{border:1.5px solid var(--brass);background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 0}
.stats .card{padding:16px}.stats .n{font-size:28px;line-height:1}.stats small{display:block;color:var(--mut);font-size:12px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);border-radius:12px}
.nav button.on{color:var(--acc);font-weight:600}
:root[data-theme="dark"] .nav button.on{color:#8FB0DE}
.nav button.on svg{stroke-width:2}
.nav .mid span{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;border:1.5px solid var(--brass);margin-top:-14px}
.nav .mid{color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:16px;margin-top:16px;padding-bottom:140px}
.m{display:flex;gap:10px;animation:in .25s ease-out}
.m.u{justify-content:flex-end}
.m.u .b{background:var(--acc);color:var(--on);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:85%;font-size:15px}
.m .b2{max-width:calc(100% - 46px);font-size:15px}
.m .b2 ol{padding-left:20px;margin:8px 0}.m .b2 li{margin:4px 0}
.src{display:inline-flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:4px 10px;margin:4px 6px 0 0;color:var(--mut)}
.acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.acts button{font-size:12px;color:var(--mut);padding:8px;min-height:36px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mut);margin:0 2px;animation:p 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dock{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:0 20px;max-width:1280px;margin:0 auto}
.dock small{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:6px}
.tg{width:48px;height:28px;border-radius:999px;background:var(--bd);position:relative;transition:.2s;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg[aria-checked=true]{background:var(--ok)}.tg[aria-checked=true]:after{left:23px}
.menu .row{min-height:52px;width:100%;text-align:left}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;animation:in .2s}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--ink);padding:24px;width:min(440px,calc(100% - 32px));box-shadow:0 24px 64px rgba(14,17,22,.25)}
dialog::backdrop{background:rgba(14,17,22,.45)}
.steps{display:flex;gap:6px;margin:12px 0 20px}.steps i{flex:1;height:3px;border-radius:2px;background:var(--bd)}.steps i.on{background:var(--brass)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14px;min-height:48px}
.opt.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
@media(min-width:900px){
#app{flex-direction:row}
#side{display:flex;flex-direction:column;width:264px;flex:none;border-right:1px solid var(--bd);padding:24px 16px;background:var(--card);overflow-y:auto}
#top{display:flex;align-items:center;gap:12px;padding:12px 40px;border-bottom:1px solid var(--bd)}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
main{padding:32px 40px 40px}
.nav{display:none}.dock{position:sticky;bottom:0;left:auto;right:auto;padding:0;background:linear-gradient(transparent,var(--bg) 30%)}
.chat{padding-bottom:24px}
h1{font-size:40px}
.hm{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:24px}
.hm>.l{grid-column:1/9}.hm>.r{grid-column:9/13;display:grid;gap:16px;align-content:start}
.home-grid{grid-template-columns:repeat(2,1fr)}.cols3{grid-template-columns:repeat(3,1fr)}
.btn{height:40px}
.sbtn{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:14px;color:var(--mut);width:100%;text-align:left;position:relative}
.sbtn:hover{background:var(--bg)}.sbtn.on{background:var(--bg);color:var(--ink);font-weight:600}
.sbtn.on:before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:2px;background:var(--brass)}
.sr{display:none}
.nomob{display:block}
}
@media(max-width:899px){.hm .r{display:grid;gap:16px;margin-top:16px}.cols3{grid-template-columns:1fr}.dskonly{display:none}}
.srch{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--card);padding:0 12px;color:var(--mut)}
.srch input{flex:1;border:0;background:none;outline:0;min-width:0;color:var(--ink);font-size:14px}
kbd{font:500 12px Inter,sans-serif;border:1px solid var(--bd);border-radius:6px;padding:1px 6px;color:var(--mut)}

.ib.rec{color:var(--err)}
.ib.rec svg{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.conn{display:flex;gap:14px;align-items:center;padding:16px}
.conn .ic{width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--acc)}
.vp{background:radial-gradient(ellipse at 50% 18%,#16264a,#0A1020 68%);color:#E8EEF8;border:1px solid #1f2d4d;border-radius:20px;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:calc(100vh - 140px)}
.vtop{display:flex;align-items:center;gap:12px;width:100%;font-size:13px;color:#9FB0CC}
.live{display:inline-flex;align-items:center;gap:6px;border:1px solid #B08D57;border-radius:999px;padding:2px 10px;color:#E8D6B3;font-size:12px}
.live i{width:6px;height:6px;border-radius:50%;background:#B08D57}
.vp .vib{color:#9FB0CC}
.stage{position:relative;width:260px;height:260px;margin:12px 0 4px;display:grid;place-items:center}
.rg{position:absolute;border-radius:50%;border:1px dashed rgba(143,176,222,.3);animation:sp 40s linear infinite}
.rg:nth-child(1){width:170px;height:170px;animation-duration:30s}.rg:nth-child(2){width:215px;height:215px;animation-direction:reverse}.rg:nth-child(3){width:258px;height:258px;animation-duration:60s;border-style:dotted}
.orb{position:relative;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#B7D2FF,#4377E0 55%,#1E3F8F);box-shadow:0 0 56px rgba(67,119,224,.45);border:0}
.listening .orb{animation:br 2.2s ease-in-out infinite}.speaking .orb{animation:br .9s ease-in-out infinite}.thinking .orb{animation:th 1.3s ease-in-out infinite}.thinking .rg{animation-duration:6s}
@keyframes br{50%{transform:scale(1.07);box-shadow:0 0 90px rgba(95,140,230,.6)}}@keyframes th{50%{opacity:.55}}@keyframes sp{to{transform:rotate(360deg)}}
.cap{font-size:15px;min-height:24px;color:#C9D6EC;margin-bottom:12px}
.vchips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.vchips button{height:40px;padding:0 14px;border-radius:999px;border:1px solid #2a3b60;color:#DCE6F7;font-size:13px;background:rgba(255,255,255,.03)}
.vcols{display:grid;gap:12px;width:100%;max-width:880px}
.vc{background:rgba(255,255,255,.04);border:1px solid #1f2d4d;border-radius:16px;padding:16px;font-size:14px;color:#DCE6F7}
.vc h3{font-size:13px;font-weight:600;color:#9FB0CC;margin-bottom:8px}
.vc .l{margin:8px 0;line-height:1.45}.vc .l b{color:#E8D6B3;font-weight:500}
.vc .t{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #1f2d4d}.vc .t:first-of-type{border-top:0}.vc .t span{flex:1}
.vc .badge{color:#9FB0CC}
.vctl{display:flex;gap:16px;align-items:center;margin:20px 0 12px}
.vctl button{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.08);color:#E8EEF8;display:grid;place-items:center}
.vctl .end{background:var(--err);color:#fff}.vctl .mu.on{background:#fff;color:#0A1020}
.vi{width:100%;max-width:520px;height:44px;border-radius:14px;border:1px solid #2a3b60;background:rgba(255,255,255,.04);color:#E8EEF8;padding:0 14px;outline:0}
.vi:focus{border-color:#B08D57}
.vn{font-size:12px;color:#7F90AE;margin-top:10px;text-align:center}
@media(min-width:900px){.vcols{grid-template-columns:1fr 1fr}.vp{padding:28px}}
.fld{width:100%;height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--ink);padding:0 12px;margin-bottom:8px;outline:0}.fld:focus{border-color:var(--acc)}</style>
</head>

<script>
const P={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19V5M8 7h7"/>',zap:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',bell:'<path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',send:'<path d="M5 12h14M13 6l6 6-6 6"/>',clip:'<path d="M21 11l-9 9a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',back:'<path d="M15 5l-7 7 7 7"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5"/>',folder:'<path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',plus:'<path d="M12 5v14M5 12h14"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M22 20c0-3-2-5-4-5.5"/>',plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 01-12 0zM12 18v4"/>',card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5M12 17h.01"/>',out:'<path d="M9 4H5a2 2 0 00-2 2v12a2 2 0 002 2h4M16 8l4 4-4 4M20 12H9"/>',moon:'<path d="M20 14A8 8 0 1110 4a6 6 0 0010 10z"/>',check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',volume:'<path d="M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 010 6"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 9"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',wa:'<path d="M12 3a9 9 0 00-7.8 13.5L3 21l4.6-1.2A9 9 0 1012 3z"/><path d="M8.5 9.5c0 3.5 3 6 6.5 6"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const $=s=>document.querySelector(s);
const ink=document.documentElement;
const mainEl=$('#main');
const NAV=[['home','Accueil','home'],['chat','Assistant','chat'],['kb','Connaissances','book'],['auto','Automatisations','zap'],['menu','Menu','menu']];
const SIDE=[['home','Accueil','home'],['chat','Assistant','chat'],['voice','Mode vocal','mic'],['kb','Connaissances','book'],['auto','Automatisations','zap'],['hist','Historique','clock'],null,['team','Équipe','users'],['int','Intégrations','plug'],['set','Paramètres','gear']];
let view='home',draft='',msgs=[{u:1,demo:1,t:'Fais-moi une synthèse des clauses de résiliation du contrat Delmas.'},{a:1}];
let filt='Tous',q='';
let autos=[{n:'Compte rendu hebdomadaire',d:'Chaque lundi à 08:00, Jarvis résume l’activité de l’équipe et l’envoie par e-mail.',l:'lundi 08:00',on:1},{n:'Relance des factures impayées',d:'Chaque jour à 09:00, Jarvis prépare un rappel pour les factures en retard de plus de 15 jours.',l:'hier',on:1},{n:'Tri des demandes entrantes',d:'Jarvis classe les e-mails de contact et propose une réponse.',l:'—',on:0}];
const cols=[['Contrats 2026','Contrats',24,'Mis à jour hier'],['Procédures RH','RH',31,'Mis à jour aujourd’hui'],['Finance & Comptabilité','Finance',18,'Il y a 3 jours'],['Fiches clients','Clients',42,'Il y a 1 semaine']];
const docs=[['Contrat_Delmas_2026.pdf','Contrats','2,4 Mo',1],['Politique_Télétravail_v3.docx','RH','180 Ko',1],['Budget_T3_2026.xlsx','Finance','96 Ko',0]];
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3000)}
function go(v,t){view=v;if(t!==undefined)draft=t;render();mainEl.scrollTop=0}

function startMic(id){
 const btn=$('#mic-'+id),input=$('#'+id);
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('Dictée non prise en charge ici : touchez le micro de votre clavier');input.focus();return}
 if(window._rec){window._rec.stop();return}
 const r=new SR();r.lang='fr-FR';r.interimResults=true;r.continuous=false;
 window._rec=r;btn.classList.add('rec');
 r.onresult=e=>{let t='';for(const res of e.results)t+=res[0].transcript;input.value=t;draft=t};
 r.onerror=e=>{toast(['not-allowed','service-not-allowed'].includes(e.error)?'Micro bloqué dans cet aperçu : touchez le micro de votre clavier pour dicter':'Micro indisponible : '+e.error);input.focus()};
 r.onend=()=>{btn.classList.remove('rec');window._rec=null};
 r.start()
}

function vSpeak(t){if(vs.mute||!window.speechSynthesis){setTimeout(()=>{vs.st='idle';vr()},2500);return}const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.onend=u.onerror=()=>{vs.st='idle';vr()};speechSynthesis.speak(u)}
function vRun(x){x=(x||'').trim();if(!x)return;window.speechSynthesis&&speechSynthesis.cancel();vs.log.push({u:x});vs.st='thinking';const p=vPlan(x),b=vs.tasks.length;vs.wa=/whatsapp/i.test(x)?(x.replace(/.*whatsapp\s*(pour|à|:)?\s*/i,'').trim()||'Bonjour,'):null;p.s.forEach(l=>vs.tasks.push({l,r:1}));vr();p.s.forEach((l,i)=>setTimeout(()=>{vs.tasks[b+i].r=0;vr()},900*(i+1)));setTimeout(async()=>{let r=p.r;if(CFG.url){try{r=await ask([{role:'user',content:await mailPre(x)}])}catch(e){r='Je n’ai pas pu joindre le serveur.'}}vs.log.push({a:r});vs.st='speaking';vr();vSpeak(r)},900*(p.s.length+1))}
function vTalk(){if(vs.st==='listening'&&window._vrec){window._vrec.stop();return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Dictée non prise en charge ici : touchez le micro de votre clavier');const i=$('#vi');i&&i.focus();return}const r=new SR();r.lang='fr-FR';r.interimResults=false;window._vrec=r;vs.st='listening';vr();r.onresult=e=>vRun(e.results[0][0].transcript);r.onerror=e=>{vs.st='idle';toast(['not-allowed','service-not-allowed'].includes(e.error)?'Micro bloqué dans cet aperçu : touchez le micro de votre clavier pour dicter':'Micro indisponible : '+e.error);vr();const i=$('#vi');i&&i.focus()};r.onend=()=>{window._vrec=null;if(vs.st==='listening'){vs.st='idle';vr()}};r.start()}
function vEnd(){window.speechSynthesis&&speechSynthesis.cancel();window._vrec&&window._vrec.stop();vs.st='idle';vs.t0=0;go('home')}
const CAP={idle:'Touchez la sphère pour parler',listening:'Je vous écoute…',thinking:'Je m’en occupe…',speaking:'Jarvis répond…'};
const voice=()=>`<div class="vp"><div class="vtop"><span class="live"><i></i>En direct</span><span id="vt">00:00</span><span style="flex:1"></span><button class="ib vib" onclick="vEnd()" aria-label="Quitter le mode vocal">${ic('x')}</button></div>
<div class="stage ${vs.st}"><div class="rg"></div><div class="rg"></div><div class="rg"></div><button class="orb" onclick="vTalk()" aria-label="Parler à Jarvis"></button></div>
<div class="cap" role="status" aria-live="polite">${CAP[vs.st]}</div>
<div class="vchips">${['Veille IA du jour','Rédige un post LinkedIn','Génère une image','Résume mes e-mails','Message WhatsApp'].map(s=>`<button onclick="vRun('${s}')">${s}</button>`).join('')}</div>
<div class="vcols"><div class="vc"><h3>Conversation</h3>${vs.log.slice(-4).map(m=>m.u?`<div class="l"><b>Vous</b><br>${esc(m.u)}</div>`:`<div class="l"><b>Jarvis</b><br>${esc(m.a)}</div>`).join('')||'<div class="l" style="color:#9FB0CC">Parlez, ou touchez un raccourci pour commencer.</div>'}</div>
<div class="vc"><h3>Actions de Jarvis</h3>${vs.tasks.slice(-6).map(t=>`<div class="t"><span>${t.l}</span><span class="badge ${t.r?'wa':'ok'}" style="flex:none">${t.r?'En cours':'Terminé'}</span></div>`).join('')||'<div class="l" style="color:#9FB0CC">Les tâches confiées à Jarvis apparaîtront ici.</div>'}${vs.wa?`<a class="btn" style="margin-top:12px;width:100%;text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(vs.wa)}" target="_blank" rel="noopener">Ouvrir WhatsApp</a>`:''}</div></div>
<div class="vctl"><button class="mu ${vs.mute?'on':''}" onclick="vs.mute=!vs.mute;if(vs.mute)window.speechSynthesis&&speechSynthesis.cancel();vr()" aria-label="Couper la voix de Jarvis" aria-pressed="${!!vs.mute}">${ic('volume')}</button><button onclick="vTalk()" aria-label="Parler" style="width:64px;height:64px;background:var(--acc)">${ic('mic')}</button><button class="end" onclick="vEnd()" aria-label="Terminer">${ic('x')}</button></div>
<input class="vi" id="vi" placeholder="Écrivez ou dictez avec le micro du clavier…" aria-label="Demande écrite" onkeydown="if(event.key==='Enter'){vRun(this.value);this.value=''}">
<p class="vn">Démo : les actions sont simulées. Jarvis demande toujours votre accord avant d’envoyer ou de publier.</p></div>`;

let CFG={url:'',token:''};
try{CFG=Object.assign(CFG,JSON.parse(localStorage.getItem('jrc_cfg')||'{}'))}catch(e){}
function saveCfg(){CFG.url=($('#cu').value||'').trim();CFG.token=($('#ct').value||'').trim();try{localStorage.setItem('jrc_cfg',JSON.stringify(CFG))}catch(e){}toast(CFG.url?'Serveur enregistré':'Mode démo (aucun serveur)');render(2)}
async function ask(list){const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.token},body:JSON.stringify({messages:list})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erreur '+r.status));return d.text}
let KB=[],SRC=[];
try{KB=JSON.parse(localStorage.getItem('jrc_kb')||'[]')}catch(e){KB=[]}
function saveKB(){try{localStorage.setItem('jrc_kb',JSON.stringify(KB));return true}catch(e){toast('Enregistrement impossible sur cet appareil');return false}}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const STOP=new Set('les des une que qui quoi pour par sur dans est sont avec mon mes ton tes son ses elle nous vous ils elles pas plus aux ces cette comme mais ont the and'.split(' '));
function ctxFor(q){SRC=[];if(!KB.length)return '';const nq=norm(q),qw=[...new Set(nq.split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!STOP.has(w)))],ch=[];
 KB.forEach(d=>{const boost=nq.includes(norm(d.n.replace(/\.[a-z0-9]+$/i,'')))?2:0;for(let i=0;i<d.t.length;i+=1200){const c=d.t.slice(i,i+1500),nc=norm(c);let s=boost;qw.forEach(w=>{if(nc.includes(w))s++});if(s>boost||(boost&&i===0))ch.push({n:d.n,c,s})}});
 let top=ch.sort((a,b)=>b.s-a.s).slice(0,4);
 let fb=0;if(!top.length&&KB.reduce((a,d)=>a+d.s,0)<=5000){top=KB.map(d=>({n:d.n,c:d.t}));fb=1}
 if(!top.length)return '';SRC=fb?[]:[...new Set(top.map(x=>x.n))];
 return 'Extraits de ma base de connaissances (appuie-toi dessus pour répondre, cite le nom du document entre crochets, et dis clairement si la réponse n’y figure pas) :\n'+top.map(x=>'['+x.n+']\n'+x.c).join('\n---\n')}
const pre=q=>{const c=ctxFor(q);return c?c+'\n\nMa question : '+q:q};
const srcHtml=m=>m.src&&m.src.length?`<div style="margin-top:8px"><small style="color:var(--mut)">Extraits consultés :</small><br>${m.src.map(n=>`<span class="src">${ic('file')}${esc(n)}</span>`).join('')}</div>`:'';
function addMenu(){const d=$('#dlg');d.innerHTML=`<h2 class="serif" style="font-size:22px;margin-bottom:8px">Ajouter des documents</h2><p class="sub" style="margin-bottom:16px">Formats acceptés : .txt, .md, .csv, .json, .html. Les PDF et Word viendront ensuite.</p><button class="opt" onclick="$('#dlg').close();$('#kf').click()">Importer des fichiers</button><button class="opt" onclick="pasteDoc()">Coller du texte</button><p class="sub" style="font-size:12px;margin:8px 0 16px">Vos documents restent sur cet appareil. Pour répondre, Jarvis envoie à l’IA seulement les extraits utiles. Avec l’offre gratuite de Google, évitez les documents confidentiels de clients.</p><div style="text-align:right"><button class="btn s" onclick="$('#dlg').close()">Annuler</button></div>`;if(!d.open)d.showModal()}
function pasteDoc(){$('#dlg').innerHTML=`<h2 class="serif" style="font-size:22px;margin-bottom:12px">Coller du texte</h2><input class="fld" id="pt" placeholder="Titre du document" aria-label="Titre"><textarea class="fld" id="pb" style="height:160px;padding:10px 12px;resize:vertical" placeholder="Collez le texte ici…" aria-label="Texte"></textarea><div style="display:flex;gap:8px;justify-content:space-between;margin-top:8px"><button class="btn s" onclick="addMenu()">Retour</button><button class="btn" onclick="savePaste()">Ajouter</button></div>`}
function savePaste(){const n=($('#pt').value||'Texte collé').trim(),t=($('#pb').value||'').trim();if(!t){toast('Collez du texte');return}$('#dlg').close();putDoc(n,t)}
function putDoc(n,t){t=t.replace(/\r/g,'').trim();if(!t){toast(n+' : fichier vide');return false}if(t.length>300000){t=t.slice(0,300000);toast(n+' : tronqué à 300 000 caractères')}if(KB.reduce((a,d)=>a+d.s,0)+t.length>1500000){toast('Espace plein : supprimez un document');return false}KB.push({n,t,s:t.length,d:new Date().toLocaleDateString('fr-FR')});if(!saveKB()){KB.pop();return false}render();toast('Document ajouté');return true}
async function addFiles(fs){for(const f of fs){if(!/\.(txt|md|csv|json|html?|xml|log)$/i.test(f.name)){toast(f.name+' : format non pris en charge pour l’instant');continue}let t=await f.text();if(/\.html?$/i.test(f.name))t=t.replace(/<(script|style)[\s\S]*?<\/\1>/gi,' ').replace(/<[^>]+>/g,' ').replace(/[ \t]+/g,' ');putDoc(f.name,t)}}
function delDoc(i){if(!confirm('Supprimer « '+KB[i].n+' » ?'))return;KB.splice(i,1);saveKB();render()}
function askDoc(i){go('chat','À propos de « '+KB[i].n+' » : ')}
const fmt=s=>s<1000?s+' car.':Math.round(s/1000)+' k car.';
const kbReal=()=>{const tot=KB.reduce((a,d)=>a+d.s,0),ds=KB.map((d,i)=>[d,i]).filter(([d])=>norm(d.n).includes(norm(q)));
return`<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap"><div style="flex:1;min-width:240px"><h1 class="serif">Base de connaissances</h1><p class="sub">Les documents sur lesquels Jarvis s’appuie pour répondre.</p></div><button class="btn" onclick="addMenu()">${ic('plus')}Ajouter des documents</button></div>
<div class="stats"><div class="card"><div class="n serif">${KB.length}</div><small>document${KB.length>1?'s':''}</small></div><div class="card"><div class="n serif">${Math.round(tot/1000)} k</div><small>caractères</small></div><div class="card"><div class="n serif" style="font-size:20px;padding-top:4px">Local</div><small>stockés sur cet appareil</small></div></div>
${CFG.url?'':'<p class="sub" style="margin-top:16px">Connectez le serveur (Intégrations) pour que Jarvis réponde à partir de vos documents.</p>'}
<div class="srch" style="margin-top:20px"><span>${ic('search')}</span><input id="kq" value="${q}" placeholder="Rechercher un document…" aria-label="Rechercher" oninput="q=this.value.toLowerCase();render(1)"></div>
<div class="sec">Vos documents</div><div class="card" style="padding:4px 20px">${ds.map(([d,i])=>`<div class="row" style="flex-wrap:wrap"><span style="color:var(--mut)">${ic('file')}</span><div class="g"><b style="overflow-wrap:anywhere">${esc(d.n)}</b><small>${fmt(d.s)} · ajouté le ${d.d}</small></div><span class="badge ok">Indexé</span><button class="btn t" style="min-height:44px" onclick="askDoc(${i})">Poser une question</button><button class="ib" onclick="delDoc(${i})" aria-label="Supprimer ${esc(d.n)}">${ic('x')}</button></div>`).join('')||'<div class="row sub">Aucun document ne correspond.</div>'}</div>
<p class="sub" style="margin-top:16px;font-size:12px">Pour répondre, Jarvis envoie à l’IA seulement les extraits utiles à votre question. Avec l’offre gratuite de Google, évitez les documents confidentiels de clients.</p>`};

let MAILN=0;
try{if(localStorage.getItem('jrc_gmail')==='1')conns.gmail=1}catch(e){}
const base=()=>CFG.url.replace(/\/+$/,'');
const hdr=()=>({'Content-Type':'application/json',Authorization:'Bearer '+CFG.token});
const MAILRX=/e-?mails?|courriels?|gmail|bo[iî]te (de r[ée]ception|mail)|inbox/i;
async function mailCtx(){const r=await fetch(base()+'/mail/inbox',{method:'POST',headers:hdr(),body:JSON.stringify({days:3,max:15})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erreur '+r.status));const it=d.items||[];MAILN=it.length;if(!it.length)return 'Ma boîte de réception ne contient aucun e-mail reçu ces 3 derniers jours.\n\n';return 'Voici mes e-mails reçus ces 3 derniers jours (expéditeur, objet, date, extrait). Appuie-toi uniquement dessus pour ma demande (résumé, priorités, brouillons de réponse) et dis clairement ce que tu ne peux pas savoir :\n'+it.map((m,i)=>(i+1)+'. De : '+m.from+' | Objet : '+m.subject+' | '+m.date+'\n   '+m.snippet).join('\n')+'\n\n'}
async function mailPre(x){let mc='';if(conns.gmail&&MAILRX.test(x)){try{mc=await mailCtx()}catch(e){}}return mc?mc+'Ma demande : '+pre(x):pre(x)}
async function gmailConnect(){if(!CFG.url){toast('Configurez d’abord le serveur (carte Serveur Jarvis)');return}
 try{const r=await fetch(base()+'/auth/url',{method:'POST',headers:hdr(),body:'{}'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erreur '+r.status));if(!window.open(d.url,'_blank'))location.href=d.url}catch(e){toast('Connexion impossible : '+e.message)}}
async function gmailCheck(){if(!CFG.url){toast('Configurez d’abord le serveur');return}
 try{const r=await fetch(base()+'/mail/inbox',{method:'POST',headers:hdr(),body:JSON.stringify({days:1,max:1})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erreur '+r.status));conns.gmail=1;try{localStorage.setItem('jrc_gmail','1')}catch(e){}toast('Gmail connecté (lecture seule)');render(2)}catch(e){toast(e.message)}}
function gmailToggle(){if(conns.gmail){conns.gmail=0;try{localStorage.setItem('jrc_gmail','0')}catch(e){}toast('Gmail déconnecté de l’app. Pour retirer l’accès : myaccount.google.com/permissions');render(2)}else gmailConnect()}

function render(keep){chrome();if(view!=='voice'){window.speechSynthesis&&speechSynthesis.cancel();if(vs.timer){clearInterval(vs.timer);vs.timer=null}}const f={home,chat,kb,auto,menu,int,voice}[view];mainEl.innerHTML=f();if(view==='voice'&&!vs.timer){vs.t0=vs.t0||Date.now();vs.timer=setInterval(()=>{const e=$('#vt');if(e){const s=Math.floor((Date.now()-vs.t0)/1000);e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},1000)}
 if(view==='chat'){mainEl.scrollTop=mainEl.scrollHeight}
 if(keep===2){const k=$('#cqi');if(k&&cq){k.focus();k.setSelectionRange(k.value.length,k.value.length)}}else if(keep){const k=$('#kq');k.focus();k.setSelectionRange(k.value.length,k.value.length)}
 const h=$('#hin')||$('#cin');if(h&&draft&&view==='chat')h.focus()}
$('#theme').onclick=()=>{const d=getComputedStyle(ink).getPropertyValue('--bg').trim()==='#0E1116';ink.dataset.theme=d?'light':'dark'};
if(window.innerWidth>=900&&view==='menu')view='home';
addEventListener('resize',()=>{if(innerWidth>=900&&view==='menu')go('home')});
render();
</script>
